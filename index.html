<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strada">
<meta name="theme-color" content="#06080b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<title>Strada</title>
<style>
:root{
  --bg:#06080b;--s1:#10141a;--s2:#171c24;--s3:#222a36;--line:#232b36;
  --tx:#f3f5f8;--mu:#8a94a3;--ac:#3fb6ff;--gr:#2fd170;--am:#ffb21e;--rd:#ff4a4a;--r:22px;
  --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;font-size:18px;color:var(--tx);background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:15px 16px;width:100%;-webkit-user-select:text;user-select:text;outline:none;-webkit-appearance:none;appearance:none}
input:focus{border-color:var(--ac)}
svg.i{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* struttura: barra con 3 pulsanti + contenuto */
.app{position:fixed;inset:0;display:grid;grid-template-columns:calc(96px + var(--sal)) 1fr}
.dock{background:var(--s1);border-right:1px solid var(--line);padding:calc(10px + var(--sat)) 10px calc(10px + var(--sab)) calc(10px + var(--sal));display:flex;flex-direction:column;gap:8px}
.dock .clock{font-weight:700;font-size:22px;text-align:center;padding:4px 0 10px;font-variant-numeric:tabular-nums}
.dock button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;flex:1;max-height:110px;border-radius:20px;color:var(--mu);font-size:13px;font-weight:700}
.dock button svg.i{width:32px;height:32px}
.dock button.on{background:var(--s3);color:var(--tx)}
main{position:relative;overflow:hidden}
.view{position:absolute;inset:0;padding:calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab)) 16px;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.view.on{display:block}
@media (orientation:portrait){
  .app{grid-template-columns:1fr;grid-template-rows:1fr calc(78px + var(--sab))}
  .dock{grid-row:2;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:8px calc(10px + var(--sar)) calc(8px + var(--sab)) calc(10px + var(--sal))}
  .dock .clock{display:none}
  .dock button{max-height:none}
  main{grid-row:1}
  .view{padding-left:calc(16px + var(--sal))}
}

h1{font-size:40px;font-weight:800;letter-spacing:-.03em}
h2{font-size:26px;font-weight:700;letter-spacing:-.02em}
h3{font-size:13px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;margin:24px 2px 10px}
.note{font-size:15px;color:var(--mu);line-height:1.45}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 2px 16px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:16px 22px;border-radius:16px;background:var(--ac);color:#00121c;font-weight:700;font-size:18px;white-space:nowrap}
.btn:active{filter:brightness(.85)}
.btn:disabled{opacity:.4}
.btn.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--line)}
.btn.green{background:var(--gr);color:#00170a}
.btn.red{background:var(--rd);color:#fff}
.btn.w{width:100%}
.btn.xl{font-size:21px;padding:20px 36px;border-radius:20px}
.icon-btn{width:50px;height:50px;border-radius:16px;background:var(--s2);display:grid;place-items:center;color:var(--mu);flex:none}
.actions{display:flex;gap:10px;margin-top:12px}
.actions .btn{flex:1}

/* tessere grandi */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;text-align:left;min-height:118px;transition:transform .12s,background .12s;min-width:0}
.tile:active{transform:scale(.97);background:var(--s2)}
.tile .ib{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--ac)) 18%,transparent);color:var(--c,var(--ac))}
.tile b{font-size:19px;display:block;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{font-size:14px;color:var(--mu);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tile.danger{background:#22090b;border-color:#4d171b}
.empty{grid-column:1/-1;text-align:center;padding:28px 16px;border:1px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;gap:12px}

/* mappa */
.view.mapview{padding:0;overflow:hidden}
.view.mapview.on{display:grid;grid-template-columns:minmax(330px,40%) 1fr}
.mpanel{grid-column:1;grid-row:1;overflow-y:auto;min-height:0;padding:calc(16px + var(--sat)) 16px calc(16px + var(--sab)) 16px;border-right:1px solid var(--line);-webkit-overflow-scrolling:touch}
.mapwrap{grid-column:2;grid-row:1;position:relative;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;background:#0b0f14}
@media (orientation:portrait){
  .view.mapview.on{grid-template-columns:1fr;grid-template-rows:46% 1fr}
  .mapwrap{grid-column:1;grid-row:1}
  .mpanel{grid-row:2;border-right:0;border-top:1px solid var(--line);padding-top:16px;padding-left:calc(16px + var(--sal))}
}
.search{display:flex;gap:10px}
.search input{flex:1;min-width:0}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.quick .tile{min-height:104px;padding:14px}
.quick .tile b{font-size:17px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:12px 15px;border-radius:14px;background:var(--s2);border:1px solid var(--line);font-size:15px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mapbtn{position:absolute;right:calc(12px + var(--sar));bottom:calc(14px + var(--sab));z-index:500;width:56px;height:56px;border-radius:18px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;color:var(--ac);box-shadow:0 6px 20px rgba(0,0,0,.5)}
.navspeed{position:absolute;left:12px;bottom:calc(14px + var(--sab));z-index:500;width:70px;height:70px;border-radius:50%;background:var(--s1);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:25px;font-variant-numeric:tabular-nums;line-height:1;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.navspeed small{font-size:10px;color:var(--mu);font-weight:600;margin-top:2px}
@media (orientation:portrait){.mapbtn,.navspeed{bottom:12px}}
.leaflet-container{font:inherit;background:#0b0f14}
.darktiles{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.88) saturate(.6)}
.leaflet-control-attribution{background:rgba(6,8,11,.75)!important;color:#7d8794!important;font-size:9px!important}
.leaflet-control-attribution a{color:#9aa4b2!important}
.car>div{width:36px;height:36px;border-radius:50%;background:var(--ac);border:3px solid #fff;box-shadow:0 0 0 7px rgba(63,182,255,.25);display:grid;place-items:center;transition:transform .6s}
.car svg{width:16px;height:16px;fill:#fff}
.dpin>div{width:22px;height:22px;border-radius:50%;background:var(--rd);border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.6)}
.list button{display:flex;align-items:center;gap:12px;width:100%;padding:16px;border-radius:16px;background:var(--s2);margin-bottom:8px;text-align:left;font-size:17px;font-weight:600}
.list button svg.i{color:var(--ac);width:24px;height:24px}
.list .rl{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.list small{font-size:13px;color:var(--mu);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list em{font-style:normal;color:var(--mu);font-size:14px;flex:none}
.man{display:flex;gap:14px;align-items:center;background:#0c3655;border:1px solid #13507c;border-radius:var(--r);padding:18px}
.man-ic{width:66px;height:66px;flex:none;display:grid;place-items:center}
.man-ic svg.i{width:62px;height:62px;stroke-width:2.4}
.man-d{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.man-t{font-size:19px;font-weight:700;margin-top:6px;line-height:1.25}
.eta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.eta div{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:10px 12px;min-width:0}
.eta b{display:block;font-size:23px;font-variant-numeric:tabular-nums;white-space:nowrap}
.eta span{font-size:12px;color:var(--mu);font-weight:600}

/* musica */
.np{display:flex;gap:16px;align-items:center}
.np img,.np .ph{width:96px;height:96px;border-radius:14px;object-fit:cover;background:var(--s2);flex:none}
.tt{min-width:0;flex:1}
.tt b{display:block;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt span{display:block;font-size:15px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.prog{height:4px;background:var(--s3);border-radius:2px;margin-top:16px;overflow:hidden}
.prog i{display:block;height:100%;background:#1ed760;width:0;transition:width 1s linear}
.ctrl{display:flex;gap:22px;justify-content:center;align-items:center;margin-top:16px}
.ctrl button{width:64px;height:64px;border-radius:50%;background:var(--s2);display:grid;place-items:center}
.ctrl button.pp{width:82px;height:82px;background:#1ed760;color:#00170a}
.ctrl button:active,.nowbar button:active{transform:scale(.93)}
.pls{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.pl{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:10px;text-align:left;min-width:0}
.pl img,.pl .ph{width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover;background:var(--s2);display:block}
.pl b{display:block;font-size:15px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowbar{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px;border-radius:18px;background:var(--s1);border:1px solid var(--line)}
.nowbar img,.nowbar .ph{width:48px;height:48px;border-radius:9px;flex:none;object-fit:cover;background:var(--s2)}
.nowbar .tt b{font-size:16px}.nowbar .tt span{font-size:13px}
.nowbar button{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--s2);flex:none}
.nowbar button.pp{background:#1ed760;color:#00170a}

/* impostazioni */
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fld span{font-size:14px;color:var(--mu);font-weight:600}
.lrow{display:flex;gap:8px;margin-bottom:8px}
.lrow input{min-width:0}
.lrow .del{width:52px;flex:none;border-radius:14px;background:var(--s2);color:var(--rd);display:grid;place-items:center}
.add{width:100%;padding:14px;border-radius:14px;border:1px dashed #33404f;color:var(--ac);font-weight:600;font-size:16px}

/* finestre */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:flex-end;justify-content:center;z-index:2000}
.sheet.on{display:flex}
.pan{background:var(--s1);border:1px solid var(--line);border-radius:26px 26px 0 0;width:min(640px,100%);max-height:90dvh;overflow:auto;padding:20px calc(20px + var(--sar)) calc(20px + var(--sab)) calc(20px + var(--sal))}
@media (orientation:landscape){.sheet{align-items:center;padding:12px}.pan{border-radius:26px;padding-bottom:20px}}
.ov{position:fixed;inset:0;z-index:3000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px calc(24px + var(--sar)) calc(24px + var(--sab)) calc(24px + var(--sal))}
.ov .note{max-width:420px}
.logo{width:88px;height:88px;border-radius:26px;background:linear-gradient(145deg,#1b2a3a,#0b1118);display:grid;place-items:center;color:var(--ac);border:1px solid var(--line)}
.logo svg.i{width:44px;height:44px}
#toast{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translate(-50%,20px);opacity:0;background:var(--s3);padding:14px 20px;border-radius:16px;font-weight:600;font-size:16px;transition:.25s;z-index:4000;pointer-events:none;max-width:88vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (orientation:portrait){#toast{bottom:calc(94px + var(--sab))}}
</style>
</head>
<body>
<div class="app">
  <nav class="dock" id="dock">
    <div class="clock" id="clock">--:--</div>
    <button data-act="tab" data-arg="maps" class="on"><svg class="i" viewBox="0 0 24 24" data-i="nav"></svg>Mappa</button>
    <button data-act="tab" data-arg="music"><svg class="i" viewBox="0 0 24 24" data-i="music"></svg>Musica</button>
    <button data-act="tab" data-arg="phone"><svg class="i" viewBox="0 0 24 24" data-i="phone"></svg>Telefono</button>
  </nav>

  <main>
    <!-- MAPPA -->
    <section class="view mapview on" id="v-maps">
      <div class="mapwrap">
        <div id="map"></div>
        <div class="navspeed" id="navspeed">--<small>km/h</small></div>
        <button class="mapbtn" data-act="recenter" aria-label="Centra sulla mia posizione"><svg class="i" viewBox="0 0 24 24" data-i="locate"></svg></button>
      </div>
      <div class="mpanel" id="mpanel">
        <div id="p-browse">
          <div class="head"><h2>Dove andiamo?</h2><button class="icon-btn" data-act="tab" data-arg="settings" aria-label="Impostazioni"><svg class="i" viewBox="0 0 24 24" data-i="settings"></svg></button></div>
          <form class="search" id="qform" autocomplete="off">
            <input id="q" type="search" placeholder="Cerca un posto" enterkeyhint="search">
            <button class="btn" type="submit" aria-label="Cerca"><svg class="i" viewBox="0 0 24 24" data-i="search"></svg></button>
          </form>
          <div class="quick" id="quick"></div>
          <div id="m-recent-wrap"><h3>Recenti</h3><div class="chips" id="m-recent"></div></div>
        </div>
        <div id="p-results" hidden>
          <div class="head"><h2 id="r-title">Risultati</h2><button class="btn ghost" data-act="back">Indietro</button></div>
          <div class="list" id="r-list"></div>
        </div>
        <div id="p-preview" hidden>
          <div class="head" style="align-items:flex-start;flex-direction:column;gap:4px"><h2 id="pv-name"></h2><span class="note" id="pv-addr"></span></div>
          <div class="card"><div class="man-d" id="pv-time" style="font-size:34px">…</div><div class="note" id="pv-sum" style="margin-top:6px">Calcolo il percorso…</div></div>
          <div class="actions">
            <button class="btn green xl" data-act="navGo" id="pv-go" style="flex:2">Avvia</button>
            <button class="btn ghost" data-act="back" style="flex:1">Annulla</button>
          </div>
        </div>
        <div id="p-nav" hidden>
          <div class="man"><div class="man-ic" id="n-ic"></div><div style="min-width:0"><div class="man-d" id="n-dist">—</div><div class="man-t" id="n-text">Calcolo…</div></div></div>
          <div class="eta">
            <div><b id="n-arr">--:--</b><span>arrivo</span></div>
            <div><b id="n-rem">--</b><span>mancano</span></div>
            <div><b id="n-km">--</b><span>distanza</span></div>
          </div>
          <div id="n-player"></div>
          <div class="actions">
            <button class="btn ghost" data-act="voice" id="n-voice"></button>
            <button class="btn red" data-act="navEnd">Termina</button>
          </div>
        </div>
      </div>
    </section>

    <!-- MUSICA -->
    <section class="view" id="v-music">
      <div class="head"><h2>Musica</h2></div>
      <div id="sp-box"></div>
      <div id="sp-pl-wrap" hidden><h3>Le tue playlist</h3><div class="pls" id="sp-pl"></div></div>
    </section>

    <!-- TELEFONO -->
    <section class="view" id="v-phone">
      <div class="head"><h2>Telefono</h2></div>
      <div class="tiles" id="ph-tiles"></div>
    </section>

    <!-- IMPOSTAZIONI -->
    <section class="view" id="v-settings">
      <div class="head"><h2>Impostazioni</h2><button class="btn" data-act="tab" data-arg="maps">Fatto</button></div>
      <div id="set-body"></div>
    </section>
  </main>
</div>

<div class="sheet" id="sheet" data-act="closeSheet" data-arg="bg">
  <div class="pan">
    <div class="head"><h2 id="sheet-t"></h2><button class="icon-btn" data-act="closeSheet" aria-label="Chiudi"><svg class="i" viewBox="0 0 24 24" data-i="x"></svg></button></div>
    <div id="sheet-b"></div>
  </div>
</div>

<div class="ov" id="start">
  <div class="logo"><svg class="i" viewBox="0 0 24 24" data-i="nav"></svg></div>
  <h1>Strada</h1>
  <button class="btn xl" data-act="start">Partiamo</button>
  <p class="note" id="install-hint" hidden>Per usarla a tutto schermo: in Safari tocca <b>Condividi</b> e poi <b>Aggiungi alla schermata Home</b>.</p>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(()=>{
'use strict';
/* ---------- icone ---------- */
const ICONS={
  nav:'<path d="M3 11 21 3l-8 18-2-8z"/>',
  music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',
  settings:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  home:'<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>',
  briefcase:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',
  fuel:'<path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M4 10h10"/><path d="M14 8h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V8l-3-3"/>',
  pin:'<path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  msg:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
  send:'<path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>',
  alert:'<path d="M12 3 2 21h20L12 3z"/><path d="M12 10v5M12 18h.01"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  locate:'<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
  vol:'<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>',
  mute:'<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/>',
  prev:'<path fill="currentColor" stroke="none" d="M6 5h2.5v14H6zM20 5v14L9 12z"/>',
  next:'<path fill="currentColor" stroke="none" d="M15.5 5H18v14h-2.5zM4 5v14l11-7z"/>',
  playf:'<path fill="currentColor" stroke="none" d="M7 4v16l13-8z"/>',

async function geocode(q,limit=8){

    if(G.lat!=null)u+=`&lat=${G.lat.toFixed(3)}&lon=${G.lon.toFixed(3)}`;
    const r=await fetch(u);
    if(r.ok){
      const out=(await r.json()).features.map(f=>{const p=f.properties||{},street=[p.street,p.housenumber].filter(Boolean).join(' ');
        return {name:p.name||street||p.city||q,addr:[p.name?street:'',p.city||p.town||p.village||p.county].filter(Boolean).join(', '),lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0]}});
      if(out.length)return out;
    }
  }catch(e){}
  const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=${limit}&accept-language=it&q=${enc(q)}`);
  if(!r.ok)throw new Error('geo');
  return (await r.json()).map(x=>({name:x.name||x.display_name.split(',')[0],addr:x.display_name.split(',').slice(1,3).join(',').trim(),lat:+x.lat,lon:+x.lon}));

async function fetchRoute(a,b){
  const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon.toFixed(6)},${a.lat.toFixed(6)};${b.lon.toFixed(6)},${b.lat.toFixed(6)}?overview=false&steps=true&geometries=geojson`);
  const j=await r.json();if(j.code!=='Ok'||!j.routes?.length)throw new Error('route');
  const rt=j.routes[0],pts=[],steps=[];
  rt.legs[0].steps.forEach(s=>{
    const start=pts.length?pts.length-1:0;
    s.geometry.coordinates.forEach((c,k)=>{if(pts.length&&k===0)return;pts.push([c[1],c[0]])});
    steps.push({i:start,m:s.maneuver,name:s.name,ref:s.ref,exits:s.exits,dest:s.destinations});
  });
  if(pts.length<2)pts.push(pts[0]);
  const cum=[0];for(let k=1;k<pts.length;k++)cum.push(cum[k-1]+hav(pts[k-1][0],pts[k-1][1],pts[k][0],pts[k][1]));
  return {pts,cum,steps,dist:cum[cum.length-1],dur:rt.duration,k:0,si:1,active:false};
}
function drawRoute(fit){

  if(fit){follow=false;map.fitBounds(routeLn.getBounds(),{padding:[40,40]})}

}
function snap(lat,lon){
  const c=Math.cos(lat*Math.PI/180),X=lo=>lo*111320*c,Y=la=>la*110540,px=X(lon),py=Y(lat),n=R.pts.length-1;
  const scan=(a,b)=>{let best={d:1e15,k:a,t:0};for(let k=a;k<b;k++){const ax=X(R.pts[k][1]),ay=Y(R.pts[k][0]),bx=X(R.pts[k+1][1]),by=Y(R.pts[k+1][0]),dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;let t=l2?((px-ax)*dx+(py-ay)*dy)/l2:0;t=Math.max(0,Math.min(1,t));const ex=ax+t*dx-px,ey=ay+t*dy-py,d=ex*ex+ey*ey;if(d<best.d)best={d,k,t}}return best};
  let b=scan(Math.max(0,R.k-5),Math.min(n,R.k+300));
  if(Math.sqrt(b.d)>50){const g=scan(0,n);if(g.d<b.d)b=g}
  R.k=b.k;
  return {d:Math.sqrt(b.d),along:R.cum[b.k]+b.t*((R.cum[b.k+1]??R.cum[b.k])-R.cum[b.k])};
}
const MODT={uturn:'fai inversione a U','sharp right':'svolta decisamente a destra',right:'svolta a destra','slight right':'tieni la destra',straight:'prosegui dritto','slight left':'tieni la sinistra',left:'svolta a sinistra','sharp left':'svolta decisamente a sinistra'};
const ORD=['','prima','seconda','terza','quarta','quinta','sesta','settima','ottava'];
function instr(st){
  const m=st.m,t=m.type,mod=m.modifier||'straight',r=st.name||st.ref||'',on=r?` in ${r}`:'',to=st.dest?` verso ${st.dest.split(',')[0]}`:on;
  const side=mod.includes('left')?'sinistra':mod.includes('right')?'destra':'';
  switch(t){
    case 'depart':return `parti${r?' su '+r:''}`;
    case 'arrive':return side?`la destinazione è sulla ${side}`:'sei arrivato a destinazione';
    case 'roundabout':case 'rotary':case 'roundabout turn':return m.exit?`alla rotonda prendi la ${ORD[m.exit]||m.exit+'ª'} uscita${on}`:`entra nella rotonda${on}`;
    case 'exit roundabout':case 'exit rotary':return `esci dalla rotonda${on}`;
    case 'merge':return `immettiti${side?' a '+side:''}${on}`;
    case 'on ramp':return `prendi la rampa${side?' a '+side:''}${to}`;
    case 'off ramp':return `prendi l'uscita${st.exits?' '+st.exits.split(';')[0]:''}${to}`;
    case 'fork':return `al bivio tieni la ${side||'destra'}${to}`;
    case 'end of road':return `alla fine della strada ${MODT[mod]||'svolta'}${on}`;
    case 'new name':case 'continue':if(mod==='straight')return `prosegui${on||' dritto'}`;
    default:return `${MODT[mod]||'prosegui'}${on}`;
  }
}
function manIcon(st){
  const t=st.m.type,mod=st.m.modifier||'straight',soft=/fork|ramp/.test(t);
  if(t==='arrive')return 'flag';if(/roundabout|rotary/.test(t)&&!t.startsWith('exit'))return 'mRound';
  if(mod==='uturn')return 'mUturn';if(mod==='slight left')return 'mSLeft';if(mod==='slight right')return 'mSRight';
  if(mod.includes('left'))return soft?'mSLeft':'mLeft';if(mod.includes('right'))return soft?'mSRight':'mRight';
  return 'mStraight';
}
const distWords=d=>d<1000?`${Math.max(50,Math.round(d/50)*50)} metri`:`${fmt(d/1000,d<10000?1:0)} chilometri`;
function updateNav(){
  if(!R||!R.active||G.lat==null)return;
  const p=snap(G.lat,G.lon);
  if(p.d>55&&(G.acc||99)<45){if(++offCount>=3&&Date.now()-lastReroute>12000)reroute()}else offCount=0;
  while(R.si<R.steps.length-1&&R.cum[R.steps[R.si].i]<p.along+4)R.si++;
  const st=R.steps[R.si],dist=Math.max(0,R.cum[st.i]-p.along),remain=Math.max(0,R.dist-p.along),remDur=R.dur*(R.dist?remain/R.dist:0),ins=instr(st);
  $('#n-ic').innerHTML=ic(manIcon(st));$('#n-dist').textContent=fmtDist(dist);$('#n-text').textContent=cap(ins);
  $('#n-arr').textContent=hm(Date.now()+remDur*1000);$('#n-rem').textContent=fmtMin(remDur);$('#n-km').textContent=fmtDist(remain);
  const v=G.kmh||0,far=v>90?1200:v>55?600:300,near=Math.max(45,v/3.6*5);
  if(/^(new name|continue)$/.test(st.m.type)&&(st.m.modifier||'straight')==='straight')said[R.si+'f']=said[R.si+'n']=1;
  if(!said[R.si+'f']&&dist<=far&&dist>near*2.2){said[R.si+'f']=1;say(`Tra ${distWords(dist)}, ${ins}`)}
  if(!said[R.si+'n']&&dist<=near){said[R.si+'n']=1;say(cap(ins))}
  if(st.m.type==='arrive'&&remain<30){say('Sei arrivato a destinazione');toast('Sei arrivato!',4000);navEnd(false)}
}
function renderVoice(){$('#n-voice').innerHTML=`${ic(S.voice?'vol':'mute')}${S.voice?'Voce sì':'Voce no'}`}
let itVoice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();itVoice=v.find(x=>/^it/i.test(x.lang)&&/Alice|Federica|Paola|Luca|Emma/i.test(x.name))||v.find(x=>/^it/i.test(x.lang))||null}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){
  if(!S.voice||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='it-IT';if(itVoice)u.voice=itVoice;speechSynthesis.speak(u)}catch(e){}
}

/* ---------- Spotify ---------- */
const SPOTIFY_CLIENT_ID='68b2f7ee7f8541d592ec7728fef2ffb7';
const SP_SCOPES='user-read-playback-state user-modify-playback-state user-read-currently-playing playlist-read-private playlist-read-collaborative';
const spRedirect=()=>location.origin+location.pathname.replace(/index\.html$/,'');
let SPT=(()=>{try{return JSON.parse(localStorage.getItem('strada.sp')||'null')}catch(e){return null}})();
let NP=null,NPat=0,PLS=null,plLoading=false,refreshing=null;
const spSave=()=>{try{SPT?localStorage.setItem('strada.sp',JSON.stringify(SPT)):localStorage.removeItem('strada.sp')}catch(e){}};
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function spLogin(){
  const v=b64u(crypto.getRandomValues(new Uint8Array(48))),st=b64u(crypto.getRandomValues(new Uint8Array(12)));
  const ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  try{localStorage.setItem('strada.spv',JSON.stringify({v,st}))}catch(e){}
  location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({response_type:'code',client_id:SPOTIFY_CLIENT_ID,scope:SP_SCOPES,redirect_uri:spRedirect(),code_challenge_method:'S256',code_challenge:ch,state:st});
}
async function spToken(params){
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:SPOTIFY_CLIENT_ID,...params})});
  if(!r.ok)throw new Error('token '+r.status);
  const j=await r.json();SPT={at:j.access_token,rt:j.refresh_token||SPT?.rt,exp:Date.now()+(j.expires_in-60)*1000};spSave();
}
async function spCallback(){
  const q=new URLSearchParams(location.search);if(!q.has('code')&&!q.has('error'))return;
  let saved={};try{saved=JSON.parse(localStorage.getItem('strada.spv')||'{}')}catch(e){}
  history.replaceState(null,'',spRedirect());
  if(q.get('error')||q.get('state')!==saved.st){toast('Collegamento a Spotify annullato');return}
  try{await spToken({grant_type:'authorization_code',code:q.get('code'),redirect_uri:spRedirect(),code_verifier:saved.v});localStorage.removeItem('strada.spv');toast('Spotify collegato!');renderAll();spPoll();spLoadPlaylists();show('music')}
  catch(e){toast('Collegamento a Spotify non riuscito, riprova')}
}
async function sp(path,opt={}){
  if(!SPT)return null;
  if(Date.now()>SPT.exp){
    refreshing=refreshing||spToken({grant_type:'refresh_token',refresh_token:SPT.rt}).finally(()=>{refreshing=null});
    try{await refreshing}catch(e){if(!navigator.onLine)return null;SPT=null;spSave();renderAll();toast('Ricollega Spotify');return null}
  }
  const r=await fetch('https://api.spotify.com/v1'+path,{...opt,headers:{Authorization:'Bearer '+SPT.at,...(opt.body?{'Content-Type':'application/json'}:{})}});
  if(r.status===401){SPT.exp=0;spSave();return null}
  if(r.status===204||r.status===202)return {};
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){const e=new Error(j?.error?.message||r.status);e.status=r.status;e.reason=j?.error?.reason;throw e}
  return j||{};
}
async function spPoll(){
  if(!SPT||document.hidden)return;
  try{
    const j=await sp('/me/player?additional_types=episode');if(j==null)return;
    const it=j.item,imgs=it?(it.album?.images||it.images||[]):[];
    NP=it?{name:it.name,artist:(it.artists||[]).map(a=>a.name).join(', ')||it.show?.name||'',img:(imgs[1]||imgs[0])?.url||'',playing:!!j.is_playing,prog:j.progress_ms||0,dur:it.duration_ms||1}:null;
    NPat=Date.now();renderNP();
  }catch(e){}
}
async function spLoadPlaylists(){
  if(!SPT||plLoading||PLS)return;
  plLoading=true;
  try{const j=await sp('/me/playlists?limit=50');if(j?.items){PLS=j.items.filter(Boolean).map(p=>({name:p.name,uri:p.uri,img:(p.images||[])[0]?.url||''}));renderSpotify()}}catch(e){}
  plLoading=false;
}
async function spWake(){
  try{
    const d=await sp('/me/player/devices'),list=d?.devices||[];
    const dev=list.find(x=>x.type==='Smartphone')||list.find(x=>!x.is_restricted);
    if(dev){await sp('/me/player',{method:'PUT',body:JSON.stringify({device_ids:[dev.id],play:false})});await new Promise(r=>setTimeout(r,800));return true}
  }catch(e){}
  sheet('Apri Spotify un attimo',`<p class="note" style="margin-bottom:16px">Spotify è chiuso. Aprilo, poi torna su Strada toccando «◀ Strada» in alto a sinistra.</p><button class="btn green w" data-act="spOpen">Apri Spotify</button>`);
  return false;
}
async function spCmd(kind,body){
  if(!SPT){spLogin();return}
  const M={play:['PUT','/me/player/play'],pause:['PUT','/me/player/pause'],next:['POST','/me/player/next'],prev:['POST','/me/player/previous']}[kind];
  const run=()=>sp(M[1],{method:M[0],body:body?JSON.stringify(body):undefined});
  if(NP&&(kind==='play'||kind==='pause')){NP.prog+=Date.now()-NPat;NPat=Date.now();NP.playing=kind==='play';renderNP()}
  try{await run()}
  catch(e){
    if(e.status===404||e.reason==='NO_ACTIVE_DEVICE'){if(await spWake()){try{await run()}catch(e2){toast('Spotify non risponde, riprova')}}}
    else if(e.reason==='PREMIUM_REQUIRED')toast('Serve Spotify Premium');
    else toast('Spotify non risponde, riprova');
  }
  setTimeout(spPoll,700);setTimeout(spPoll,2500);
}
const npImg=()=>NP?.img?`<img src="${esc(NP.img)}" alt="">`:`<div class="ph"></div>`;
const ctrls=cls=>`<button data-act="spPrev" aria-label="Precedente">${ic('prev')}</button><button class="pp" data-act="spPP" aria-label="Play o pausa">${ic(NP?.playing?'pausef':'playf')}</button><button data-act="spNext" aria-label="Successivo">${ic('next')}</button>`;
function renderNowbars(){
  const n=$('#n-player');if(!n)return;
  n.innerHTML=SPT?`<div class="nowbar">${npImg()}<div class="tt"><b>${esc(NP?.name||'Spotify')}</b><span>${esc(NP?.artist||'In pausa')}</span></div><button class="pp" data-act="spPP" aria-label="Play o pausa">${ic(NP?.playing?'pausef':'playf')}</button><button data-act="spNext" aria-label="Successivo">${ic('next')}</button></div>`:'';
}
function progPct(){if(!NP)return 0;return Math.min(100,(NP.prog+(NP.playing?Date.now()-NPat:0))/NP.dur*100)}
function renderSpotify(){
  const box=$('#sp-box');
  if(!SPT){
    box.innerHTML=`<div class="card"><div class="np"><div class="ph" style="display:grid;place-items:center;color:#1ed760">${ic('music')}</div><div class="tt"><b>Collega Spotify</b><span>Una volta sola, poi comandi la musica da qui</span></div></div><button class="btn green w" style="margin-top:16px" data-act="spLogin">Collega Spotify</button></div>`;
    $('#sp-pl-wrap').hidden=true;return;
  }
  box.innerHTML=`<div class="card"><div class="np">${npImg()}<div class="tt"><b>${esc(NP?.name||'Niente in riproduzione')}</b><span>${esc(NP?.artist||'Scegli una playlist qui sotto')}</span></div></div><div class="prog"><i style="width:${progPct()}%"></i></div><div class="ctrl">${ctrls()}</div></div>`;
  $('#sp-pl-wrap').hidden=!PLS?.length;
  const pl=$('#sp-pl');
  if(PLS&&pl.dataset.n!==String(PLS.length)){pl.dataset.n=PLS.length;pl.innerHTML=PLS.map((p,i)=>`<button class="pl" data-act="spPl" data-arg="${i}">${p.img?`<img src="${esc(p.img)}" alt="" loading="lazy">`:'<div class="ph"></div>'}<b>${esc(p.name)}</b></button>`).join('')}
}
function renderNP(){if(view==='music')renderSpotify();renderNowbars()}

/* ---------- schermo sempre acceso ---------- */
let wl=null,started=false;
async function keepAwake(){started=true;try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(started)keepAwake();spPoll()}});
let AC=null;function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}

/* ---------- avvio ---------- */
paintIcons(document);
if(IOS&&!STANDALONE)$('#install-hint').hidden=false;
renderAll();renderVoice();
pendingResume=!!S.navDest;
spCallback();
setInterval(()=>{
  const d=new Date();$('#clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes());
  if(NP?.playing)document.querySelectorAll('.prog i').forEach(e=>e.style.width=progPct()+'%');
  if(G.t&&Date.now()-G.t>20000&&G.kmh){G.kmh=null;$('#navspeed').firstChild.textContent='--'}
},1000);
setInterval(spPoll,5000);spPoll();
{const d=new Date();$('#clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes())}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
