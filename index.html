<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strada">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<title>Strada</title>
<style>
:root{
  --bg:#000;--c1:#1c1c1e;--c2:#2c2c2e;--c3:#3a3a3c;--sep:rgba(84,84,88,.6);
  --tx:#fff;--tx2:rgba(235,235,245,.62);--tx3:rgba(235,235,245,.32);
  --blue:#0a84ff;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--pink:#ff375f;--r:20px;
  --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-text-size-adjust:100%;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;font-size:17px;color:var(--tx);background:var(--c2);border:0;border-radius:12px;padding:13px 14px;width:100%;-webkit-user-select:text;user-select:text;outline:none;-webkit-appearance:none;appearance:none}
input::placeholder{color:var(--tx2)}
svg.i{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button:active{opacity:.6}

/* ---------- struttura: barra laterale + area principale ---------- */
.app{position:fixed;inset:0;display:grid;grid-template-columns:calc(84px + var(--sal)) 1fr}
.side{display:flex;flex-direction:column;align-items:center;padding:calc(10px + var(--sat)) 0 calc(12px + var(--sab)) var(--sal);gap:14px;background:#000}
.sb{display:flex;flex-direction:column;align-items:center;gap:3px;padding-bottom:4px}
.sb b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.sb svg{width:22px;height:12px}
.apps{display:flex;flex-direction:column;gap:14px;align-items:center}
.ai{position:relative;width:58px;height:58px;border-radius:14px;display:grid;place-items:center;color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.12) inset}
.ai svg.i{width:30px;height:30px}
.ai.map{background:linear-gradient(160deg,#5ed27a,#1d9a4c)}
.ai.music{background:linear-gradient(160deg,#ffb340,#ff375f)}
.ai.set{background:linear-gradient(160deg,#8e8e93,#48484a)}
.ai.on::before{content:"";position:absolute;left:-12px;top:50%;width:5px;height:5px;border-radius:50%;background:#fff;transform:translateY(-50%)}
.dash{margin-top:auto;width:58px;height:58px;border-radius:14px;display:grid;place-items:center;color:var(--tx2)}
.dash.on{color:#fff;background:var(--c2)}
.dash svg{width:30px;height:30px}

.stage{position:relative;display:grid;gap:8px;padding:calc(8px + var(--sat)) calc(8px + var(--sar)) calc(8px + var(--sab)) 0;min-width:0;min-height:0}
.card{position:relative;background:var(--c1);border-radius:var(--r);overflow:hidden;min-width:0;min-height:0}
.glass{background:rgba(30,30,32,.88);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.45)}

/* modalità: dashboard / mappa / musica */
.app[data-mode=dash] .stage{grid-template-columns:minmax(0,1.62fr) minmax(0,1fr)}
.app[data-mode=map] .stage,.app[data-mode=music] .stage{grid-template-columns:1fr}
.wcol{display:flex;flex-direction:column;gap:8px;min-height:0}
.wcol .card{flex:1}
.app:not([data-mode=dash]) .wcol{display:none}
.app[data-mode=music] .mapcard{display:none}
.musicv{display:none}
.app[data-mode=music] .musicv{display:flex}
.app:not([data-mode=map]) .mpanel{display:none}
.app:not([data-mode=dash]) .dsearch,.app:not([data-mode=dash]) .dnav{display:none}

/* ---------- mappa ---------- */
#map{position:absolute;inset:0;background:#22262b}
.maplibregl-ctrl-attrib{background:rgba(0,0,0,.45)!important;font-size:9px}
.maplibregl-ctrl-attrib a{color:#9a9aa0!important}
.maplibregl-ctrl-attrib-button{filter:invert(1)}
.mapbtn{position:absolute;right:10px;bottom:10px;z-index:5;width:50px;height:50px;display:grid;place-items:center;color:var(--blue)}
.navspeed{position:absolute;right:10px;bottom:68px;z-index:5;width:56px;height:56px;border-radius:50%;background:#fff;color:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:21px;font-variant-numeric:tabular-nums;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.navspeed small{font-size:9px;font-weight:600;color:#555;margin-top:1px}
.dsearch{position:absolute;left:10px;top:10px;z-index:5;display:flex;align-items:center;gap:8px;padding:12px 18px 12px 14px;font-size:17px;font-weight:600;color:var(--tx2)}
.dsearch svg.i{width:20px;height:20px}
.dnav{position:absolute;left:10px;top:10px;right:76px;z-index:6;display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(21,92,52,.95);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.dnav svg.i{width:40px;height:40px;stroke-width:2.6}
.dnav b{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.dnav span{display:block;font-size:15px;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car{width:34px;height:34px;border-radius:50%;background:var(--blue);border:3px solid #fff;display:grid;place-items:center;box-shadow:0 0 0 8px rgba(10,132,255,.22),0 3px 8px rgba(0,0,0,.5)}
.car svg{width:16px;height:16px}
.car.game{width:44px;height:44px;border-radius:0;background:none;border:0;box-shadow:none}
.car.game svg{width:44px;height:44px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
.dpin{width:26px;height:26px;border-radius:50%;background:var(--red);border:4px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.6)}
.spin{width:18px;height:18px;border-radius:50%;background:var(--orange);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.6)}

/* pannello sopra la mappa (modalità Mappa) */
.mpanel{position:absolute;left:10px;top:10px;z-index:6;width:min(370px,48%);max-height:calc(100% - 20px);overflow-y:auto;overflow-x:hidden;padding:14px;-webkit-overflow-scrolling:touch}
.ptitle{font-size:22px;font-weight:700;margin:2px 2px 12px}
.search{display:flex;gap:8px;align-items:center;background:var(--c2);border-radius:12px;padding-left:12px;color:var(--tx2)}
.search svg.i{width:20px;height:20px}
.search input{background:none;padding-left:4px}
.sec{font-size:15px;font-weight:600;color:var(--tx2);margin:16px 4px 10px}
.favs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fav{display:flex;flex-direction:column;align-items:center;gap:7px;padding:4px 0;min-width:0}
.fav .c{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff}
.fav .c svg.i{width:26px;height:26px}
.fav b{font-size:14px;font-weight:600;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav small{font-size:12px;color:var(--tx2);margin-top:-5px}
.rows{background:var(--c2);border-radius:14px;overflow:hidden}
.rows button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left;border-bottom:.5px solid var(--sep);min-width:0}
.rows button:last-child{border-bottom:0}
.rows .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;background:var(--c3)}
.rows .dot svg.i{width:18px;height:18px}
.rows .rl{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rows .rl b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows .rl small{font-size:13px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows em{font-style:normal;color:var(--tx2);font-size:14px;flex:none}
.note{font-size:15px;color:var(--tx2);line-height:1.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:14px;background:var(--c2);color:var(--tx);font-weight:600;font-size:17px;white-space:nowrap;min-width:0}
.btn.go{background:var(--green);color:#fff;font-size:19px}
.btn.blue{background:var(--blue);color:#fff}
.btn.red{color:var(--red)}
.btn.w{width:100%}
.btn:disabled{opacity:.4}
.acts{display:flex;gap:8px;margin-top:10px}
.acts .btn{flex:1;padding-left:10px;padding-right:10px;overflow:hidden;text-overflow:ellipsis}
.big{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.man{display:flex;gap:12px;align-items:center;background:rgba(21,92,52,.95);border-radius:16px;padding:14px}
.man-ic{width:58px;height:58px;flex:none;display:grid;place-items:center}
.man-ic svg.i{width:54px;height:54px;stroke-width:2.6}
.man-d{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.man-t{font-size:17px;font-weight:600;margin-top:5px;line-height:1.25}
.eta{display:grid;grid-template-columns:repeat(3,1fr);margin-top:8px;background:var(--c2);border-radius:14px}
.eta div{padding:10px 12px;min-width:0}
.eta div+div{border-left:.5px solid var(--sep)}
.eta b{display:block;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.eta span{font-size:12px;color:var(--tx2);font-weight:600}

/* ---------- riquadri della dashboard ---------- */
.wcard{padding:14px 16px;display:flex;flex-direction:column}
.wh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.02em;margin-bottom:10px}
.wh i{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-style:normal}
.wh i svg.i{width:12px;height:12px;color:#fff;stroke-width:2.6}
.np{display:flex;gap:12px;align-items:center;min-width:0;text-align:left}
.np img,.np .ph{width:58px;height:58px;border-radius:8px;object-fit:cover;background:var(--c3);flex:none}
.tt{min-width:0;flex:1}
.tt b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt span{display:block;font-size:15px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.prog{height:4px;background:var(--c3);border-radius:2px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:#fff;width:0;transition:width 1s linear}
.ctrl{display:flex;justify-content:space-around;align-items:center;margin-top:auto;padding-top:8px}
.ctrl button{width:56px;height:52px;display:grid;place-items:center}
.ctrl svg.i{width:30px;height:30px}
.ctrl .pp svg.i{width:38px;height:38px}
.wd{display:flex;flex-direction:column;flex:1;min-height:0}
.wd .rows{background:none;margin:0 -8px}
.wd .rows button{padding:5px 8px;border-bottom:0;border-radius:12px;gap:10px}
.wd .rows .dot{width:30px;height:30px}
.wd .rows .rl b{font-size:15px}
.wd .rows .rl small{font-size:12px}
.wd .big{font-size:30px}
.wd .acts{margin-top:auto}

/* ---------- Musica a tutto schermo ---------- */
.musicv{position:relative;background:var(--c1);border-radius:var(--r);overflow:hidden;align-items:center;gap:28px;padding:22px 28px;min-height:0}
.musicv .bgart{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(50px) saturate(1.3) brightness(.45);opacity:.9}
.musicv>*{position:relative}
.mart{height:min(100%,320px);aspect-ratio:1;border-radius:12px;object-fit:cover;background:var(--c3);box-shadow:0 12px 40px rgba(0,0,0,.5);flex:none}
.minfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.minfo h2{font-size:28px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minfo .ar{font-size:20px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minfo .prog{margin-top:18px;height:5px}
.times{display:flex;justify-content:space-between;font-size:13px;color:var(--tx2);font-variant-numeric:tabular-nums;margin-top:6px}
.minfo .ctrl{margin-top:14px;justify-content:center;gap:40px;padding:0}
.minfo .ctrl button{width:70px;height:70px}
.minfo .ctrl svg.i{width:42px;height:42px}
.minfo .ctrl .pp svg.i{width:54px;height:54px}
.minfo .acts{margin-top:18px}
.pls{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:14px}
.pl{text-align:left;min-width:0}
.pl img,.pl .ph{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover;background:var(--c3);display:block}
.pl b{display:block;font-size:14px;font-weight:600;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowbar{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px 10px;border-radius:14px;background:var(--c2)}
.nowbar img,.nowbar .ph{width:44px;height:44px;border-radius:6px;flex:none;object-fit:cover;background:var(--c3)}
.nowbar .tt b{font-size:15px}.nowbar .tt span{font-size:13px}
.nowbar button{width:42px;height:42px;display:grid;place-items:center;flex:none}

/* ---------- impostazioni, finestre, avvio ---------- */
.view{position:fixed;inset:0;z-index:50;background:#000;overflow-y:auto;padding:calc(18px + var(--sat)) calc(20px + var(--sar)) calc(20px + var(--sab)) calc(20px + var(--sal));display:none}
.view.on{display:block}
.vin{max-width:640px;margin:0 auto}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.head h2{font-size:30px;font-weight:700}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fld span{font-size:14px;color:var(--tx2);font-weight:600}
.lrow{display:flex;gap:8px}
.seg{display:flex;background:var(--c2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:11px 8px;border-radius:9px;font-weight:600;font-size:15px;color:var(--tx2)}
.seg button.on{background:var(--c3);color:#fff}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:12px}
.sheet.on{display:flex}
.pan{width:min(680px,100%);max-height:calc(100dvh - 24px);overflow:auto;padding:18px 18px calc(18px + var(--sab))}
.pan .head h2{font-size:22px}
.xbtn{width:38px;height:38px;border-radius:50%;background:var(--c3);display:grid;place-items:center;color:var(--tx2)}
.xbtn svg.i{width:18px;height:18px}
.ov{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
.ov h1{font-size:38px;font-weight:700}
.ov .ai{width:96px;height:96px;border-radius:22px}
.ov .ai svg.i{width:50px;height:50px}
.ov .btn{min-width:220px}
#toast{position:fixed;left:50%;top:calc(16px + var(--sat));transform:translate(-50%,-20px);opacity:0;padding:13px 20px;font-weight:600;font-size:16px;transition:.25s;z-index:80;pointer-events:none;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- telefono in verticale ---------- */
@media (orientation:portrait){
  .app{grid-template-columns:1fr;grid-template-rows:1fr calc(76px + var(--sab))}
  .side{grid-row:2;flex-direction:row;padding:8px calc(14px + var(--sar)) calc(8px + var(--sab)) calc(14px + var(--sal));gap:12px;border-top:.5px solid var(--sep)}
  .sb{padding:0 6px 0 0}
  .apps{flex-direction:row}
  .ai{width:52px;height:52px;border-radius:13px}
  .ai.on::before{left:50%;top:auto;bottom:-8px;transform:translateX(-50%)}
  .dash{margin:0 0 0 auto;width:52px;height:52px}
  .stage{grid-row:1;padding:calc(8px + var(--sat)) calc(8px + var(--sar)) 0 calc(8px + var(--sal))}
  .app[data-mode=dash] .stage,.app[data-mode=map] .stage,.app[data-mode=music] .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .app:not([data-mode=dash]) .stage{grid-template-rows:minmax(0,1fr)}
  .wcol{flex-direction:row}
  .wcol .card{min-height:190px;flex:1 1 0;padding:12px}
  .wcol .acts .btn{padding:12px 6px;font-size:15px}
  .wcol .ctrl button{width:44px}
  .mpanel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:58%}
  .musicv{flex-direction:column;justify-content:center;gap:18px;padding:22px}
  .mart{height:auto;width:min(78%,300px)}
  .minfo{width:100%;flex:none}
  .np img,.np .ph{width:48px;height:48px}
}
</style>
</head>
<body>
<div class="app" id="app" data-mode="dash">
  <nav class="side">
    <div class="sb"><b id="clock">--:--</b><svg viewBox="0 0 22 12" aria-hidden="true"><rect x="0" y="8" width="4" height="4" rx="1" fill="#fff"/><rect x="6" y="5" width="4" height="7" rx="1" fill="#fff"/><rect x="12" y="2.5" width="4" height="9.5" rx="1" fill="#fff"/><rect x="18" y="0" width="4" height="12" rx="1" fill="rgba(255,255,255,.35)"/></svg></div>
    <div class="apps">
      <button class="ai map" data-act="mode" data-arg="map" aria-label="Mappe"><svg class="i" viewBox="0 0 24 24" data-i="nav"></svg></button>
      <button class="ai music" data-act="mode" data-arg="music" aria-label="Musica"><svg class="i" viewBox="0 0 24 24" data-i="music"></svg></button>
      <button class="ai set" data-act="openSet" aria-label="Impostazioni"><svg class="i" viewBox="0 0 24 24" data-i="gear"></svg></button>
    </div>
    <button class="dash on" data-act="mode" data-arg="dash" aria-label="Schermata principale"><svg viewBox="0 0 30 30" aria-hidden="true"><rect x="3" y="3" width="10.5" height="24" rx="3" fill="currentColor"/><rect x="16.5" y="3" width="10.5" height="10.5" rx="3" fill="currentColor"/><rect x="16.5" y="16.5" width="10.5" height="10.5" rx="3" fill="currentColor"/></svg></button>
  </nav>

  <main class="stage">
    <div class="card mapcard" id="mapcard">
      <div id="map"></div>
      <button class="dsearch glass" data-act="mode" data-arg="map"><svg class="i" viewBox="0 0 24 24" data-i="search"></svg>Cerca</button>
      <div class="dnav" id="dnav" hidden><span id="d-ic"></span><div style="min-width:0"><b id="d-dist"></b><span id="d-text"></span></div></div>
      <div class="navspeed" id="navspeed">--<small>km/h</small></div>
      <button class="mapbtn glass" data-act="recenter" aria-label="Centra sulla mia posizione"><svg class="i" viewBox="0 0 24 24" data-i="locate"></svg></button>

      <div class="mpanel glass" id="mpanel">
        <div id="p-browse">
          <form class="search" id="qform" autocomplete="off"><svg class="i" viewBox="0 0 24 24" data-i="search"></svg><input id="q" type="search" placeholder="Cerca un posto" enterkeyhint="search"></form>
          <div class="sec">Preferiti</div>
          <div class="favs" id="quick"></div>
          <div id="m-recent-wrap"><div class="sec">Recenti</div><div class="rows" id="m-recent"></div></div>
        </div>
        <div id="p-results" hidden>
          <div class="head" style="margin-bottom:10px"><h2 class="ptitle" id="r-title" style="margin:0;font-size:20px">Risultati</h2><button class="xbtn" data-act="back" aria-label="Indietro"><svg class="i" viewBox="0 0 24 24" data-i="x"></svg></button></div>
          <div class="rows" id="r-list"></div>
        </div>
        <div id="p-preview" hidden>
          <div class="ptitle" id="pv-name" style="margin-bottom:2px"></div>
          <div class="note" id="pv-addr"></div>
          <div class="big" id="pv-time" style="margin-top:12px">…</div>
          <div class="note" id="pv-sum">Calcolo il percorso…</div>
          <div class="acts"><button class="btn go" data-act="navGo" id="pv-go" style="flex:2">Vai</button><button class="btn" data-act="back">Annulla</button></div>
        </div>
        <div id="p-nav" hidden>

</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(()=>{
'use strict';
/* ---------- icone ---------- */
const ICONS={
  nav:'<path d="M3 11 21 3l-8 18-2-8z"/>',
  music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.6M12 18.9v2.6M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12h2.6M18.9 12h2.6M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/>',
  home:'<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>',
  fuel:'<path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M4 10h10"/><path d="M14 8h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V8l-3-3"/>',
  pin:'<path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  locate:'<path d="M3 11 21 3l-8 18-2-8z"/>',
  vol:'<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>',
  mute:'<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  prev:'<path fill="currentColor" stroke="none" d="M11 6v12L2.5 12zM21 6v12l-8.5-6z"/>',
  next:'<path fill="currentColor" stroke="none" d="M13 6v12l8.5-6zM3 6v12l8.5-6z"/>',
  playf:'<path fill="currentColor" stroke="none" d="M7 4.5v15l12.5-7.5z"/>',
  pausef:'<path fill="currentColor" stroke="none" d="M6 4.5h4v15H6zM14 4.5h4v15h-4z"/>',
  mStraight:'<path d="M12 21V4M6 10l6-6 6 6"/>',
  mRight:'<path d="M6 21v-8a4 4 0 0 1 4-4h10M15 4l5 5-5 5"/>',
  mLeft:'<path d="M18 21v-8a4 4 0 0 0-4-4H4M9 4 4 9l5 5"/>',
  mSRight:'<path d="M8 21v-7l9-9M10 5h7v7"/>',
  mSLeft:'<path d="M16 21v-7L7 5M14 5H7v7"/>',
  mUturn:'<path d="M7 21V9a5 5 0 0 1 10 0v6M13 11l4 4 4-4"/>',
  mRound:'<circle cx="12" cy="10" r="4.5"/><path d="M12 14.5V21M15.2 6.8 19 3M14 3h5v5"/>',
  flag:'<path d="M5 21V4M5 4h12l-2.5 4.5L17 13H5"/>'
};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;
const paintIcons=root=>root.querySelectorAll('svg[data-i]').forEach(s=>{s.innerHTML=ICONS[s.dataset.i]||'';s.removeAttribute('data-i')});

/* ---------- utilità ---------- */
const $=s=>document.querySelector(s);
const enc=encodeURIComponent;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const ms2=ms=>{const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+':'+pad(s%60)};
const fmt=(v,d=1)=>Number(v||0).toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d});
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const STANDALONE=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
function hav(a,b,c,d){const R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function open(u){location.href=u}
// richiesta con tempo massimo, così l'app non resta mai bloccata se un servizio è lento
function fetchT(u,opt={},ms=8000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return fetch(u,{...opt,signal:c.signal}).finally(()=>clearTimeout(t))}
let toastT;function toast(t,ms=2600){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),ms)}

/* ---------- dati salvati (solo su questo telefono) ---------- */
const DEF={home:'',work:'',workName:'',recent:[],geo:{},navDest:null,voice:true,mapStyle:'auto'};
const S=(()=>{try{return {...DEF,...JSON.parse(localStorage.getItem('strada.cfg')||'{}')}}catch(e){return {...DEF}}})();
const save=()=>{try{localStorage.setItem('strada.cfg',JSON.stringify(S))}catch(e){}};

/* ---------- modalità: dashboard, mappa, musica ---------- */
let mode='dash';
function setMode(m){
  mode=m;$('#app').dataset.mode=m;
  document.querySelectorAll('.side [data-act=mode]').forEach(b=>b.classList.toggle('on',b.dataset.arg===m));
  if(m==='music'){renderMusicView();spLoadPlaylists();spPoll()}
  else{initMap();setTimeout(()=>{if(map){map.resize();updateCar(true);if(R&&!R.active)drawRoute(true)}},40)}
}
const goMap=()=>{if(mode!=='map')setMode('map')};
function favs(){
  return [
    {k:'home',i:'home',b:'Casa',c:'#0a84ff',ok:!!S.home},
    {k:'work',i:'pin',b:S.workName||'Preferito',c:'#ff375f',ok:!!S.work},
    {k:'fuel',i:'fuel',b:'Benzina',c:'#ff9f0a',ok:true}
  ];
}
const favAct=f=>f.k==='fuel'?'data-act="fuel"':f.ok?`data-act="nav" data-arg="${f.k}"`:'data-act="openSet"';
function renderMaps(){
  $('#quick').innerHTML=favs().map(f=>`<button class="fav" ${favAct(f)}><span class="c" style="background:${f.c}">${ic(f.i)}</span><b>${esc(f.b)}</b>${f.ok?'':'<small>Imposta</small>'}</button>`).join('');
  $('#m-recent-wrap').hidden=!S.recent.length;
  $('#m-recent').innerHTML=S.recent.slice(0,4).map((r,i)=>`<button data-act="recent" data-arg="${i}"><span class="dot">${ic('clock')}</span><span class="rl"><b>${esc(r)}</b></span></button>`).join('');
}
// riquadro in basso a destra della dashboard: destinazioni, oppure il viaggio in corso
function renderDest(){
  const w=$('#w-dest');
  if(R&&R.active){
    w.innerHTML=`<div class="wh"><i style="background:#30d158">${ic('nav')}</i>Verso ${esc(R.dest.name)}</div>
      <div class="wd"><div class="big" id="w-arr">--:--</div><div class="note" id="w-sum">arrivo</div>
      <div class="acts"><button class="btn" data-act="stops">Soste</button><button class="btn red" data-act="navEnd">Fine</button></div></div>`;
  }else{
    w.innerHTML=`<div class="wh"><i style="background:#0a84ff">${ic('pin')}</i>Destinazioni</div>
      <div class="wd"><div class="rows">${favs().map(f=>`<button ${favAct(f)}><span class="dot" style="background:${f.c}">${ic(f.i)}</span><span class="rl"><b>${esc(f.b)}</b><small>${f.k==='fuel'?'Distributori vicini':f.ok?esc(f.k==='home'?S.home:S.work):'Tocca per impostare'}</small></span></button>`).join('')}</div></div>`;
  }
}
function renderAll(){renderMaps();renderDest();renderPlayers()}

/* ---------- impostazioni ---------- */
function renderSettings(){
  $('#set-body').innerHTML=`
  <label class="fld"><span>Indirizzo di casa</span><input data-k="home" value="${esc(S.home)}" placeholder="Via Roma 1, Milano"></label>
  <div class="lrow"><label class="fld" style="flex:1"><span>Secondo posto: nome</span><input data-k="workName" value="${esc(S.workName)}" placeholder="Varese"></label><label class="fld" style="flex:2"><span>Indirizzo</span><input data-k="work" value="${esc(S.work)}" placeholder="Via Mirabello 25, Varese"></label></div>
  <div class="fld"><span>Stile mappa</span><div class="seg"><button class="${S.mapStyle!=='game'?'on':''}" data-act="mstyle" data-arg="auto">Auto (scura)</button><button class="${S.mapStyle==='game'?'on':''}" data-act="mstyle" data-arg="game">Videogioco</button></div></div>
  <div class="fld"><span>Spotify</span><div class="rows"><button data-act="${SPT?'spLogout':'spLogin'}"><span class="dot" style="background:#1db954">${ic('music')}</span><span class="rl"><b>${SPT?'Collegato':'Non collegato'}</b><small>${SPT?'Tocca per scollegare':'Tocca per collegare'}</small></span></button></div></div>
  <p class="note" style="margin-top:18px">I tuoi dati restano solo su questo telefono.</p>`;
}
document.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset.k)return;
  S[el.dataset.k]=el.value.trim();save();renderMaps();renderDest();
});

/* ---------- azioni ---------- */
const A={
  start(){$('#start').hidden=true;unlockAudio();startGPS();keepAwake();say('');setMode('dash')},
  mode:m=>setMode(m),
  openSet(){renderSettings();$('#v-settings').classList.add('on');$('#v-settings').scrollTop=0},
  closeSet(){$('#v-settings').classList.remove('on')},
  mstyle(s){S.mapStyle=s;save();renderSettings();applyStyle()},
  nav(k){navAddress(k==='home'?S.home:S.work,k==='home'?'Casa':(S.workName||'Preferito'))},
  stops(){findStops()},
  stop(i){const s=STOPS[+i];if(s&&R){closeSheet();routeTo(R.dest,s)}},
  recent(i){const r=S.recent[+i];if(r)doSearch(r)},
  fuel(){poiSearch()},
  pick(i){const r=RES[+i];if(r)routeTo(r)},
  back(){if(R&&!R.active)clearRoute();panel(RES.length&&!$('#p-preview').hidden?'results':R&&R.active?'nav':'browse')},
  navGo(){navGo()},
  navEnd(){navEnd(true)},
  voice(){S.voice=!S.voice;save();renderVoice();if(S.voice)say('Voce attiva')},
  recenter(){follow=true;updateCar(true)},
  spLogin(){spLogin()},
  spLists(){openPlaylists()},
  spLogout(){SPT=null;spSave();NP=null;PLS=null;renderAll();renderSettings();renderMusicView()},
  spOpen:()=>open('spotify:'),
  spPP(){spCmd(NP?.playing?'pause':'play')},
  spNext(){spCmd('next')},
  spPrev(){spCmd('prev')},
  spPl(i){const p=PLS?.[+i];if(p){closeSheet();spCmd('play',{context_uri:p.uri})}},
  closeSheet:(g,el,e)=>{if(g==='bg'&&e.target!==el)return;closeSheet()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f)f(el.dataset.arg,el,e)});
$('#qform').addEventListener('submit',e=>{
  e.preventDefault();const v=$('#q').value.trim();if(!v)return;
  S.recent=[v,...S.recent.filter(x=>x.toLowerCase()!==v.toLowerCase())].slice(0,4);save();
  $('#q').value='';$('#q').blur();renderMaps();doSearch(v);
});
function sheet(t,html){$('#sheet-t').textContent=t;$('#sheet-b').innerHTML=html;$('#sheet').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on')}

/* ---------- GPS ---------- */
const G={lat:null,lon:null,acc:null,kmh:null,hdg:null,t:0};
let watchId=null;
function startGPS(){
  if(!('geolocation' in navigator)||watchId!=null)return;
  watchId=navigator.geolocation.watchPosition(onPos,e=>{if(e.code===1)toast('Consenti la posizione: Impostazioni › Privacy › Localizzazione',6000)},{enableHighAccuracy:true,maximumAge:0,timeout:30000});
}
function onPos(p){
  const c=p.coords,now=p.timestamp||Date.now();
  let kmh=(c.speed!=null&&c.speed>=0)?c.speed*3.6:null;
  if(kmh==null&&G.lat!=null&&now>G.t){const v=hav(G.lat,G.lon,c.latitude,c.longitude)/((now-G.t)/1000)*3.6;if(now-G.t<10000)kmh=v}
  if(kmh!=null&&kmh<3)kmh=0;
  Object.assign(G,{lat:c.latitude,lon:c.longitude,acc:c.accuracy,kmh,t:now});
  if(c.heading!=null&&!isNaN(c.heading)&&kmh>3)G.hdg=c.heading;
  $('#navspeed').firstChild.textContent=kmh==null?'--':Math.round(kmh);
  updateCar();updateNav();
  if(pendingResume&&c.accuracy<=100){pendingResume=false;resumeNav()}
}

/* ---------- mappa e navigazione ---------- */
const ML=window.maplibregl;
let map=null,mapReady=false,carMk=null,destMk=null,viaMk=null,follow=true,R=null,PV=null,RES=[],STOPS=[],STOPMAP=new Map(),offCount=0,lastReroute=0,said={},pendingResume=false;
const fmtDist=d=>d<950?`${Math.round(d/10)*10} m`:`${fmt(d/1000,d<10000?1:0)} km`;
const fmtMin=s=>{const m=Math.max(1,Math.round(s/60));return m<60?`${m} min`:`${Math.floor(m/60)} h ${pad(m%60)}`};
function panel(p){['browse','results','preview','nav'].forEach(x=>$('#p-'+x).hidden=x!==p);$('#mpanel').scrollTop=0;if(p!=='browse'&&p!=='nav')goMap()}
const ROUTE={auto:['#0645a3','#0a84ff'],game:['#3a0019','#ff3d8b']};
/* Due stili di mappa originali: "auto" (scura, sobria, da schermo auto) e "videogioco". */
function mapStyle(){
  const game=S.mapStyle==='game';
  const P=game?{bg:'#3b4842',farm:'#455a40',wood:'#2f4b35',town:'#555c61',park:'#3f6b45',water:'#2378b5',bld:'#6b7378',bldo:'#454c50',cas:'#262c30',casmw:'#5c4612',minor:'#b9bfc4',mid:'#d9dde0',main:'#f1f2f3',mw:'#f5c542',txt:'#ffffff',halo:'#1d2326',mwt:'#1d1600',mwh:'#f5c542',fuel:'#ff7a1a'}
    :{bg:'#23272c',farm:'#252b27',wood:'#212b25',town:'#2a2e34',park:'#22352a',water:'#1a2f47',bld:'#33383f',bldo:'#2a2e34',cas:'#16191c',casmw:'#1c2333',minor:'#3c424a',mid:'#4c535d',main:'#626a76',mw:'#7d8ca6',txt:'#d8dde3',halo:'#16191c',mwt:'#ffffff',mwh:'#46557a',fuel:'#ff9f0a'};
  const NAME=['coalesce',['get','name:it'],['get','name']],FR=['Noto Sans Regular'],FB=['Noto Sans Bold'];
  const cls=(...c)=>['match',['get','class'],c,true,false];
  const W=(a,b,c)=>['interpolate',['exponential',1.5],['zoom'],5,a,10,b,16,c];
  const line=(id,f,color,w,min)=>({id,type:'line',source:'m','source-layer':'transportation',minzoom:min||0,filter:f,layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':color,'line-width':w}});
  const HALO={'text-halo-color':P.halo,'text-halo-width':2};
  return {version:8,glyphs:'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
    sources:{m:{type:'vector',url:'https://tiles.openfreemap.org/planet',attribution:'© OpenStreetMap · OpenFreeMap'}},
    layers:[
      {id:'bg',type:'background',paint:{'background-color':P.bg}},
      {id:'farm',type:'fill',source:'m','source-layer':'landcover',filter:cls('farmland','grass'),paint:{'fill-color':P.farm}},
      {id:'wood',type:'fill',source:'m','source-layer':'landcover',filter:cls('wood'),paint:{'fill-color':P.wood}},
      {id:'town',type:'fill',source:'m','source-layer':'landuse',filter:cls('residential','commercial','industrial','retail'),paint:{'fill-color':P.town}},
      {id:'park',type:'fill',source:'m','source-layer':'park',paint:{'fill-color':P.park}},
      {id:'water',type:'fill',source:'m','source-layer':'water',paint:{'fill-color':P.water}},
      {id:'river',type:'line',source:'m','source-layer':'waterway',paint:{'line-color':P.water,'line-width':['interpolate',['linear'],['zoom'],8,1,16,6]}},
      {id:'bld',type:'fill',source:'m','source-layer':'building',minzoom:14,paint:{'fill-color':P.bld,'fill-outline-color':P.bldo}},
      line('c-minor',cls('minor','service'),P.cas,W(0,1.2,10),12),
      line('c-mid',cls('secondary','tertiary'),P.cas,W(.6,2.6,14),8),
      line('c-main',cls('primary','trunk'),P.cas,W(1,3.8,18)),
      line('c-mw',cls('motorway'),P.casmw,W(1.6,5,20)),
      line('r-minor',cls('minor','service'),P.minor,W(0,.6,7),12),
      line('r-mid',cls('secondary','tertiary'),P.mid,W(.3,1.6,10),8),
      line('r-main',cls('primary','trunk'),P.main,W(.6,2.4,13)),
      line('r-mw',cls('motorway'),P.mw,W(1,3.2,14)),
      {id:'fuel',type:'circle',source:'m','source-layer':'poi',minzoom:11,filter:cls('fuel'),paint:{'circle-radius':['interpolate',['linear'],['zoom'],11,4,16,8],'circle-color':P.fuel,'circle-stroke-color':'#fff','circle-stroke-width':2}},
      {id:'n-road',type:'symbol',source:'m','source-layer':'transportation_name',minzoom:13,filter:cls('primary','secondary','tertiary','minor','trunk'),layout:{'symbol-placement':'line','text-field':NAME,'text-font':game?FB:FR,'text-size':12},paint:{'text-color':P.txt,...HALO}},
      {id:'n-mw',type:'symbol',source:'m','source-layer':'transportation_name',minzoom:6,filter:['all',cls('motorway'),['has','ref']],layout:{'symbol-placement':'line','symbol-spacing':400,'text-field':['get','ref'],'text-font':FB,'text-size':13,'text-rotation-alignment':'viewport'},paint:{'text-color':P.mwt,'text-halo-color':P.mwh,'text-halo-width':4}},
      {id:'n-fuel',type:'symbol',source:'m','source-layer':'poi',minzoom:14,filter:cls('fuel'),layout:{'text-field':NAME,'text-font':FR,'text-size':11,'text-offset':[0,1.2],'text-anchor':'top'},paint:{'text-color':P.fuel,...HALO}},
      {id:'n-village',type:'symbol',source:'m','source-layer':'place',minzoom:11,filter:cls('village','suburb'),layout:{'text-field':NAME,'text-font':game?FB:FR,'text-size':13},paint:{'text-color':P.txt,...HALO}},
      {id:'n-city',type:'symbol',source:'m','source-layer':'place',minzoom:4,filter:cls('city','town'),layout:{'text-field':NAME,'text-font':FB,'text-transform':game?'uppercase':'none','text-letter-spacing':game?.2:0,'text-size':['interpolate',['linear'],['zoom'],5,11,9,15,13,20]},paint:{'text-color':'#ffffff','text-halo-color':P.halo,'text-halo-width':game?3:2}}
    ]};
}
function addRouteLayers(){
  const [cas,col]=ROUTE[S.mapStyle==='game'?'game':'auto'];
  if(!map.getSource('route'))map.addSource('route',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'route-case',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':cas,'line-width':['interpolate',['linear'],['zoom'],5,6,16,17]}},'n-road');
  map.addLayer({id:'route',type:'line',source:'route',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':col,'line-width':['interpolate',['linear'],['zoom'],5,3.5,16,11]}},'n-road');
  mapReady=true;if(R)drawRoute(!R.active);
}
function initMap(){
  if(map)return;
  if(!ML){$('#map').innerHTML='<p class="note" style="padding:20px">Mappa non disponibile: serve la connessione internet.</p>';return}
  map=new ML.Map({container:'map',style:mapStyle(),center:G.lat!=null?[G.lon,G.lat]:[11,43.8],zoom:G.lat!=null?14:6,attributionControl:{compact:true},pitchWithRotate:false,dragRotate:false});
  map.on('style.load',addRouteLayers);
  map.on('dragstart',()=>{follow=false});
}
function applyStyle(){if(!map)return;mapReady=false;carMk&&carMk.remove();carMk=null;map.setStyle(mapStyle());setTimeout(()=>updateCar(true),300)}
// spazio occupato dal pannello sopra la mappa, così l'auto resta al centro della parte visibile
function mapPad(nav){

async function fetchRoute(a,b,via){

    s.geometry.coordinates.forEach((c,k)=>{if(pts.length&&k===0)return;pts.push([c[1],c[0]])});
    steps.push({i:start,m:s.maneuver,name:s.name,ref:s.ref,exits:s.exits,dest:s.destinations,stop:s.maneuver.type==='arrive'&&li<rt.legs.length-1});

}

      if(!r.ok)throw 0;

function renderStops(p,more){

    let best=1e12,bk=R.k;for(let k=R.k;k<R.pts.length;k+=2){const d=hav(R.pts[k][0],R.pts[k][1],s.lat,s.lon);if(d<best){best=d;bk=k}}

    const dx=(b[1]-a[1])*c,dy=b[0]-a[0],vx=(s.lon-a[1])*c,vy=s.lat-a[0];

  }).filter(s=>s.off<400&&s.ahead>500&&(s.right||s.off<40)).sort((a,b)=>a.ahead-b.ahead).slice(0,20);

function snap(lat,lon){
  const c=Math.cos(lat*Math.PI/180),X=lo=>lo*111320*c,Y=la=>la*110540,px=X(lon),py=Y(lat),n=R.pts.length-1;
  const scan=(a,b)=>{let best={d:1e15,k:a,t:0};for(let k=a;k<b;k++){const ax=X(R.pts[k][1]),ay=Y(R.pts[k][0]),bx=X(R.pts[k+1][1]),by=Y(R.pts[k+1][0]),dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;let t=l2?((px-ax)*dx+(py-ay)*dy)/l2:0;t=Math.max(0,Math.min(1,t));const ex=ax+t*dx-px,ey=ay+t*dy-py,d=ex*ex+ey*ey;if(d<best.d)best={d,k,t}}return best};

const MODT={uturn:'fai inversione a U','sharp right':'svolta decisamente a destra',right:'svolta a destra','slight right':'tieni la destra',straight:'prosegui dritto','slight left':'tieni la sinistra',left:'svolta a sinistra','sharp left':'svolta decisamente a sinistra'};
const ORD=['','prima','seconda','terza','quarta','quinta','sesta','settima','ottava'];
function instr(st){
  const m=st.m,t=m.type,mod=m.modifier||'straight',r=st.name||st.ref||'',on=r?` in ${r}`:'',to=st.dest?` verso ${st.dest.split(',')[0]}`:on;
  const side=mod.includes('left')?'sinistra':mod.includes('right')?'destra':'';
  switch(t){
    case 'depart':return `parti${r?' su '+r:''}`;
    case 'arrive':if(st.stop)return 'sei arrivato alla sosta';return side?`la destinazione è sulla ${side}`:'sei arrivato a destinazione';
    case 'roundabout':case 'rotary':case 'roundabout turn':return m.exit?`alla rotonda prendi la ${ORD[m.exit]||m.exit+'ª'} uscita${on}`:`entra nella rotonda${on}`;
    case 'exit roundabout':case 'exit rotary':return `esci dalla rotonda${on}`;
    case 'merge':return `immettiti${side?' a '+side:''}${on}`;
    case 'on ramp':return `prendi la rampa${side?' a '+side:''}${to}`;
    case 'off ramp':return `prendi l'uscita${st.exits?' '+st.exits.split(';')[0]:''}${to}`;
    case 'fork':return `al bivio tieni la ${side||'destra'}${to}`;
    case 'end of road':return `alla fine della strada ${MODT[mod]||'svolta'}${on}`;
    case 'new name':case 'continue':if(mod==='straight')return `prosegui${on||' dritto'}`;

  }

    try{await refreshing}catch(e){if(!navigator.onLine)return null;SPT=null;spSave();renderAll();toast('Ricollega Spotify');return null}
  }
  const r=await fetch('https://api.spotify.com/v1'+path,{...opt,headers:{Authorization:'Bearer '+SPT.at,...(opt.body?{'Content-Type':'application/json'}:{})}});
  if(r.status===401){SPT.exp=0;spSave();return null}
  if(r.status===204||r.status===202)return {};
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){const e=new Error(j?.error?.message||r.status);e.status=r.status;e.reason=j?.error?.reason;throw e}
  return j||{};
}
async function spPoll(){
  if(!SPT||document.hidden)return;
  try{
    const j=await sp('/me/player?additional_types=episode');if(j==null)return;
    const it=j.item,imgs=it?(it.album?.images||it.images||[]):[];
    NP=it?{name:it.name,artist:(it.artists||[]).map(a=>a.name).join(', ')||it.show?.name||'',img:(imgs[1]||imgs[0])?.url||'',big:imgs[0]?.url||'',playing:!!j.is_playing,prog:j.progress_ms||0,dur:it.duration_ms||1}:null;
    NPat=Date.now();renderPlayers();
  }catch(e){}
}
async function spLoadPlaylists(){
  if(!SPT||plLoading||PLS)return;
  plLoading=true;
  try{const j=await sp('/me/playlists?limit=50');if(j?.items){PLS=j.items.filter(Boolean).map(p=>({name:p.name,uri:p.uri,img:(p.images||[])[0]?.url||''}))}}catch(e){}
  plLoading=false;
}
async function spWake(){
  try{
    const d=await sp('/me/player/devices'),list=d?.devices||[];
    const dev=list.find(x=>x.type==='Smartphone')||list.find(x=>!x.is_restricted);
    if(dev){await sp('/me/player',{method:'PUT',body:JSON.stringify({device_ids:[dev.id],play:false})});await new Promise(r=>setTimeout(r,800));return true}
  }catch(e){}
  sheet('Apri Spotify un attimo',`<p class="note" style="margin-bottom:16px">Spotify è chiuso. Aprilo, poi torna su Strada toccando «◀ Strada» in alto a sinistra.</p><button class="btn go w" data-act="spOpen">Apri Spotify</button>`);
  return false;
}
async function spCmd(kind,body){
  if(!SPT){spLogin();return}
  const M={play:['PUT','/me/player/play'],pause:['PUT','/me/player/pause'],next:['POST','/me/player/next'],prev:['POST','/me/player/previous']}[kind];
  const run=()=>sp(M[1],{method:M[0],body:body?JSON.stringify(body):undefined});
  if(NP&&(kind==='play'||kind==='pause')){NP.prog+=Date.now()-NPat;NPat=Date.now();NP.playing=kind==='play';renderPlayers()}
  try{await run()}
  catch(e){
    if(e.status===404||e.reason==='NO_ACTIVE_DEVICE'){if(await spWake()){try{await run()}catch(e2){toast('Spotify non risponde, riprova')}}}
    else if(e.reason==='PREMIUM_REQUIRED')toast('Serve Spotify Premium');
    else toast('Spotify non risponde, riprova');
  }
  setTimeout(spPoll,700);setTimeout(spPoll,2500);
}
const npImg=()=>NP?.img?`<img src="${esc(NP.img)}" alt="">`:`<div class="ph"></div>`;
const ctrls=()=>`<button data-act="spPrev" aria-label="Precedente">${ic('prev')}</button><button class="pp" data-act="spPP" aria-label="Play o pausa">${ic(NP?.playing?'pausef':'playf')}</button><button data-act="spNext" aria-label="Successivo">${ic('next')}</button>`;
const progPos=()=>NP?Math.min(NP.dur,NP.prog+(NP.playing?Date.now()-NPat:0)):0;
const progPct=()=>NP?progPos()/NP.dur*100:0;
const MH=`<div class="wh"><i style="background:linear-gradient(160deg,#ffb340,#ff375f)">${ic('music')}</i>In riproduzione</div>`;
// riquadro musica della dashboard + barra compatta in navigazione + schermata Musica
function renderPlayers(){
  const w=$('#w-music');
  w.innerHTML=!SPT
    ?`${MH}<div class="np"><div class="ph" style="display:grid;place-items:center;color:#1db954">${ic('music')}</div><div class="tt"><b>Spotify</b><span>Collegalo una volta sola</span></div></div><div class="ctrl"><button class="btn go" style="width:auto" data-act="spLogin">Collega Spotify</button></div>`
    :`${MH}<button class="np" data-act="mode" data-arg="music">${npImg()}<span class="tt"><b>${esc(NP?.name||'Niente in riproduzione')}</b><span>${esc(NP?.artist||'Tocca per scegliere una playlist')}</span></span></button><div class="prog"><i style="width:${progPct()}%"></i></div><div class="ctrl">${ctrls()}</div>`;
  $('#n-player').innerHTML=SPT?`<div class="nowbar">${npImg()}<div class="tt"><b>${esc(NP?.name||'Spotify')}</b><span>${esc(NP?.artist||'In pausa')}</span></div><button data-act="spPP" aria-label="Play o pausa">${ic(NP?.playing?'pausef':'playf')}</button><button data-act="spNext" aria-label="Successivo">${ic('next')}</button></div>`:'';
  if(mode==='music')renderMusicView();
}
function renderMusicView(){
  const v=$('#musicv');
  if(!SPT){v.innerHTML=`<div class="mart" style="display:grid;place-items:center;color:#1db954">${ic('music')}</div><div class="minfo"><h2>Spotify</h2><div class="ar">Collega il tuo account una volta sola: poi comandi la musica da qui.</div><div class="acts"><button class="btn go" data-act="spLogin">Collega Spotify</button></div></div>`;return}
  v.innerHTML=`${NP?.big?`<div class="bgart" style="background-image:url('${esc(NP.big)}')"></div>`:''}
    ${NP?.big?`<img class="mart" src="${esc(NP.big)}" alt="">`:`<div class="mart"></div>`}
    <div class="minfo"><h2>${esc(NP?.name||'Niente in riproduzione')}</h2><div class="ar">${esc(NP?.artist||'Scegli una playlist')}</div>
    <div class="prog"><i style="width:${progPct()}%"></i></div><div class="times"><span id="mv-el">${ms2(progPos())}</span><span id="mv-rem">-${ms2((NP?.dur||0)-progPos())}</span></div>
    <div class="ctrl">${ctrls()}</div>
    <div class="acts"><button class="btn" data-act="spLists">${ic('list')}Playlist</button><button class="btn" data-act="spOpen">Apri Spotify</button></div></div>`;
}
function plGrid(){return PLS?.length?`<div class="pls">${PLS.map((p,i)=>`<button class="pl" data-act="spPl" data-arg="${i}">${p.img?`<img src="${esc(p.img)}" alt="" loading="lazy">`:'<div class="ph"></div>'}<b>${esc(p.name)}</b></button>`).join('')}</div>`:loading('Carico le tue playlist…')}
async function openPlaylists(){
  sheet('Playlist',plGrid());
  if(!PLS){await spLoadPlaylists();if($('#sheet').classList.contains('on'))$('#sheet-b').innerHTML=PLS?plGrid():loading('Non riesco a caricare le playlist, riprova.')}
}

/* ---------- schermo sempre acceso ---------- */
let wl=null,started=false;
async function keepAwake(){started=true;try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(started)keepAwake();spPoll()}});
let AC=null;function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}
addEventListener('resize',()=>{if(map)setTimeout(()=>{map.resize();updateCar(true)},120)});

/* ---------- avvio ---------- */
paintIcons(document);
if(IOS&&!STANDALONE)$('#install-hint').hidden=false;
renderAll();renderVoice();
pendingResume=!!S.navDest;
spCallback();
const tick=()=>{
  const d=new Date();$('#clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes());
  if(NP?.playing){document.querySelectorAll('.prog i').forEach(e=>e.style.width=progPct()+'%');const el=$('#mv-el');if(el){el.textContent=ms2(progPos());$('#mv-rem').textContent='-'+ms2(NP.dur-progPos())}}
  if(G.t&&Date.now()-G.t>20000&&G.kmh){G.kmh=null;$('#navspeed').firstChild.textContent='--'}
};
tick();setInterval(tick,1000);
setInterval(spPoll,5000);spPoll();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
